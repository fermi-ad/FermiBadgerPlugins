name: "VirtualAccelerator_MADXSuite"
version: "0.2"
dependencies:
  - badger-opt
  - numpy
  - xtrack
  - cpymad
interface:
  - VirtualAccelerator_MADXSuiteInterface
params:
  lattice_filename: "sim_configs/DeliveryRing/mu2e-dr-model-v2026.03.23.madx"
  sequence_name: "full"
  # Position monitors in the Mu2e Delivery Ring lattice are named
  # P_DHPnnn (horizontal) / P_DVPnnn (vertical).
  bpm_name_pattern: "^p_d[hv]p"
  debug: false

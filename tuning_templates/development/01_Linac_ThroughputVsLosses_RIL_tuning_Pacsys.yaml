description: |
  DEVELOPMENT, started 2026-11-17: the most throughput for the lowest losses, as a Pareto front.
  Goal: map the trade-off between Linac throughput and losses, so the operator can pick a setting
    from the front instead of a fixed weighting.
  Objectives (MOBO, two at once): L:D7TOR MAXIMIZE (toroid at the Linac end); L:TUNRAD MINIMIZE
    (loss monitor).
  Reference point: L:D7TOR 20 (about the 10th percentile of 192 beam-on RIL sessions in the data
    logger, the floor the loss-objective template uses) and L:TUNRAD 150 (the operations template's
    limit; 99th percentile of history 146). Points worse than either do not count toward the front.
  Constraints: as in 01_Linac_RIL_tuning.yaml, without L:TUNRAD < 150 (now an objective):
    L:D7LMSM < 18, L:TK4RAD < 50, the source A bulk supply (BulkPS_SourceATrims_Pos, _Neg < 8),
    MultOOB_MUQ, MultOOB_MDQ < 0.5.
  Variables, windows, parameters: as in 01_Linac_RIL_tuning.yaml.
  Observables: G:LINEFF, L:TK4RAD, L:D7LMSM, B:BLMLAM, B:BLMQ3, B:BOOEFF.
  Console: the RIL tuning knobs are on parameter page L48, sub-page <1>, tab PWR_SUP.
  Operational context (not tuned here): parameter page L48, sub-page <1>, tabs SRC_A and
  SRC_B, the ion sources A and B, which set the beam the RIL receives. Per source (A named;
  B the same with B): extractor supply L:AEXTI, L:AEXTV, L:AEXTSV, L:AEXTSW, L:AEXTON,
  L:AEXTPW; source current toroid L:ATOR; arc supply L:AARCSI, L:AARCV, L:AARCI, L:AARCZ,
  L:AARCON, L:AARCPW; gas valve L:AGASV, L:AGASSP, L:AGASON, L:AGASOW, pressure
  L:AIGAUT, L:AIG, L:ALCC (pressure loop G:PIDPV[3] on L:AIGAUT; B: G:PIDPV[2] on
  L:BIGAUT; A also L:AWRVG, B also L:BGASI); temperatures L:ACTEMP, L:ASTEMP, L:ATTEMP,
  L:AVTEMP, L:ABTEMP, L:ARACKT; heaters L:ASRCI, L:ATUBEI, L:AVLVI, L:ABOILI, boiler loop
  L:ABSP (G:PIDPV[8] on L:ABTEMP; B: G:PIDPV[9]); spark counters L:AEVS, L:AEIS. Read
  from two screenshots by exact glyph matching, checked by eye.
  Context (2026-11 study of 90 days of logged history, docs/ril-source-context.md): which
  ion source is in use and its parameters, with the beam rate, predict the level of
  L:D7TOR in held-out weeks (about 19 mA on source B, 24 on source A). Whether they also
  change how L:D7TOR responds to these knobs is suggestive, not established: the pooled
  gain from letting knobs and source parameters combine comes mostly from one week, and
  week by week it helps in 11 of 14 (sign test p 0.03); no single source parameter helps
  consistently. Record the source settings (L48 <1>, tabs SRC_A and SRC_B) with each run,
  and compare runs within one source state. Correlation in logged history, not a designed
  test.
  Context (same study): the levels of L:TUNRAD and L:TK1RAD follow the settings of the
  source in use and the beam rate (held-out R2 0.84 and 0.75), but how they respond to the
  knobs does not (no interaction found); L:TK4RAD is predicted by none of it (its level changes
  little from week to week).
  Context variables (ticked; read every step and modeled, never moved): L:AARCI.READING,
  L:ASRCI.READING, L:AEXTV.READING, source A arc current, heater current, and extractor
  volts, the top three source parameters for L:D7TOR (docs/ril-source-context.md). On
  source B, tick the L:B ones instead.
  Notes: acquisition search limited to 0.5 s with 5 restarts (on the DR simulation: MOBO steps
    4.1 s -> 0.8 s, same quality over 3 seeds; untested on RIL). No TuRBO controller (MOBO).
    Not yet run on the machine.
environment:
  name: 01_Linac_RIL_tuning_Pacsys
  params:
    debug: false
    mults:
      MDQ:
        step: 0.05
        members:
          L:MDQ1: 20.0
          L:MDQ2: 20.0
      MUQ:
        step: 0.05
        members:
          L:MUQ1: 20.0
          L:MUQ2: 20.0
    periodic_devices:
      L:RFBPAH: 360.0
      L:RFQPAH: 360.0
      L:V5QSET: 360.0
    sample_events:
      B:BOOEFF: '@e,1f,e,0'
      default: '@e,52,e,0'
    settings_role: ril_tuning
    BulkPS_Limit:
      MEBTQ1trims:
        limit: 7.0
        devices:
        - L:MUQ1H
        - L:MUQ1V
        - L:MDQ1H
        - L:MDQ1V
      MEBTQ2trims:
        limit: 7.0
        devices:
        - L:MUQ2H
        - L:MUQ2V
        - L:MDQ2H
        - L:MDQ2V
      SourceATrims:
        positive: 8.0
        negative: 8.0
        devices:
        - L:ATRMHU
        - L:ATRMVU
        - L:ATRMHD
        - L:ATRMVD
      SourceBTrims:
        limit: 7.0
        devices:
        - L:BTRMHU
        - L:BTRMVU
        - L:BTRMHD
        - L:BTRMVD

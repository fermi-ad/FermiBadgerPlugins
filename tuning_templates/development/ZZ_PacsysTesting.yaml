badger_version: 1.6.0
critical_constraint_names: []
description: 'Harmless live exercise of BasicPacsysInterface against ACNET test/scratch
  devices. Objective TwoWells: a coupled 4-D landscape with its global minimum -6.0
  at G:AMANDA=3, Z:CUBE_X=-4, Z:CUBE_Y=2, Z:CUBE_Z=5 and a shallower decoy (-3.06)
  elsewhere; start the devices anywhere in -10..10 and watch BO find it.'
environment:
  name: ZZ_PacsysTesting
  params:
    debug: false
    settings_role: testing
generator:
  max_travel_distances: null
  n_interpolate_points: null
  name: expected_improvement
  numerical_optimizer:
    max_iter: 2000
    max_time: null
    n_restarts: 20
    name: LBFGS
  turbo_controller: null
initial_point_actions:
- type: add_curr
- config:
    fraction: 0.1
    method: 0
    n_points: 3
  type: add_rand
name: zz-pacsys-testing
relative_to_current: false
vocs:
  constants: {}
  constraints: {}
  objectives:
    TwoWells: MINIMIZE
  observables:
  - AbsProduct
  - CombineObjective
  - AMANDA_sq
  - CUBE_X_sq
  - CUBE_Y_sq
  - CUBE_Z_sq
  variables:
    G:AMANDA:
    - -10.0
    - 10.0
    Z:CUBE_X:
    - -10.0
    - 10.0
    Z:CUBE_Y:
    - -10.0
    - 10.0
    Z:CUBE_Z:
    - -10.0
    - 10.0
vrange_limit_options:
  G:AMANDA:
    delta: 10.0
    limit_option_idx: 2
    ratio_curr: 0.1
    ratio_full: 0.1
  Z:CUBE_X:
    delta: 10.0
    limit_option_idx: 2
    ratio_curr: 0.1
    ratio_full: 0.1
  Z:CUBE_Y:
    delta: 10.0
    limit_option_idx: 2
    ratio_curr: 0.1
    ratio_full: 0.1
  Z:CUBE_Z:
    delta: 10.0
    limit_option_idx: 2
    ratio_curr: 0.1
    ratio_full: 0.1
xopt_version: 2.6.2

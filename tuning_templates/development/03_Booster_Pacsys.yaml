name: 03_Booster_Pacsys
badger_version: 1.6.0
relative_to_current: true
description: |
  General template of the Booster-wide environment 03_Booster_Pacsys: by default the
  injection-tuning selection below; check or uncheck devices in the GUI for other tasks.
  DRAFT, generated by tuning-reflection from the elog and data logger (929 catalog
  entries, 2013-06-24 to 2026-11-11; see docs/reflections/booster_injection/). Unconfirmed until
  the hardware owner signs off. Environment: 03_Booster_Pacsys, the Booster-wide
  environment (docs/booster-environment.md); this template picks its injection devices.

  Goal: the elog's own goal-tags on these sessions name losses far more often than
  throughput or efficiency (487 mentions vs. 95 and 109 of 929 sessions; of the 404
  naming exactly one goal, 354 say losses vs. 27 throughput and 23 efficiency).
  Operators chase whichever ring sector (a specific Short or Long BLM) is spiking
  that day, not one fixed device.

  Objective: WorstLossNorm MINIMIZE. A computed observable (this environment's
  get_observables), not a single device: max over every calibrated Booster BLM of
  (reading - historical baseline) / historical IQR. Lets one optimizer run respond
  to whichever sector is actually out of its usual range, instead of betting on one
  device per template. 28/49 BLMs are calibrated (see the environment module for
  which, and why the rest are excluded); untested whether the normalization should
  instead be per-BLM-family or use a different robust scale.

  Constraint: B:BOOEFF > 91.0 (a floor, not the objective, per the user's framing:
  efficiency is a thing to not let slip, not the thing to chase). 91.0 is the
  historical 10th percentile of B:BOOEFF's own readings across 696 sessions with
  logger data (2 implausible readings outside [0, 100] dropped) -- a level the
  machine already clears 90% of the time without trying, same method as the RIL
  template's L:D7TOR floor.

  Variables: L:C7PHAS (Linac accel.-cavity RF phase, shared Linac/Booster boundary
  device), B:VIMIN/B:VIMAX (GMPS injection-porch/extraction-flattop current),
  B:MH1/B:MH2 (horizontal bends), B:MV1/B:MV2 (vertical bends). Hard limits: the
  environment's, from 90 days of logged settings to 2026-11-19 (p1 to p99, widened),
  not a hardware owner's sign-off. SAFETY: B:VIMIN (its autotune) and L:C7PHAS (its
  logged setting changes on nearly every pulse) are also written by other loops; the
  environment refuses Badger writes to them until allow_auto_written names them, after
  the hardware owners confirm the loops will not fight.

  Windows: +-delta around the live readback (delta per variable below), chosen
  2026-11-12 before setting histories were available; untested against them. (The
  .SETTING histories exist: a bare logger DRF returns them, where the event-qualified
  reads used then did not.)

  Observables: B:BOOEFF, G:LINEFF, every Short/Long BLM and B:BLMLAM (same scope as
  the WorstLossNorm devices, whether or not each is individually calibrated).

  Notes: readings pulled on a bare LOGGER DRF (no @event) -- confirmed 2026-11-12 to
  work for Short BLMs and B:BOOEFF/B:VIMIN; most Long BLMs (all but 01/10/11) and
  G:LINEFF are rarely logged at all (n=14-42 vs. ~1850 for the Shorts), so they stay
  observable-only and do not feed WorstLossNorm.
environment:
  name: 03_Booster_Pacsys
  params:
    debug: false
    settings_role: nosettings
    allow_auto_written: []
    sample_events: {}
    average_events: {default: 1}
    periodic_devices: {L:C7PHAS: 360.0, L:CDPHAS: 360.0}
generator:
  name: expected_improvement
  max_travel_distances: null
  numerical_optimizer:
    name: LBFGS
    discrete_max_batch_size: 2048
    discrete_max_choices: 4096
    max_iter: 2000
    max_time: 5.0
    mixed_max_discrete_configurations: 512
    n_restarts: 20
  turbo_controller:
    name: SafetyTurboController
    failure_tolerance: 6
    length: 0.021475
    length_max: 2.0
    length_min: 0.007813
    restrict_model_data: true
    scale_factor: 1.25
    success_tolerance: 6
initial_point_actions:
- type: add_curr
- type: add_rand
  config:
    fraction: 0.1
    method: 0
    n_points: 3
critical_constraint_names: []
vrange_hard_limit:
  L:C7PHAS: [154.034, 167.492]
  B:VIMIN: [100.538, 105.447]
  B:VIMAX: [948.01, 986.705]
  B:MH1: [342.671, 362.879]
  B:MH2: [678.213, 711.191]
  B:MV1: [365.035, 386.971]
  B:MV2: [354.276, 375.928]
vrange_limit_options:

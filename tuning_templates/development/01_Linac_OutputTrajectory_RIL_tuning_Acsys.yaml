additional_variables: []
badger_version: 1.6.0
constraint_formulas: {}
critical_constraint_names: []
description: |
  Goal: Steer the vertical trajectory out of the Linac onto its BPM targets.
  Objective: VTrajError_SumSqBPM_calc MINIMIZE, the sum over L:D73BPV, L:D74BPV and B:VPQ2 of
    (reading - setpoint) squared.
  Variables: vertical trims L:D72TMV, L:D73TMV, L:D74TMV.
  Constraints: none.
  Observables: the three squared errors L:D73BPV-SETPOINT, L:D74BPV-SETPOINT, B:VPQ2-SETPOINT.
  Windows: +-0.3 around the live readback at load (Automatic).
  Notes: the targets are the setpoints in the environment params; edit them there. Readings on $52.
environment:
  name: 01_Linac_RIL_tuning_Acsys
  params:
    debug: false
    sample_events:
      B:BOOEFF: '@e,1f,e,0'
      default: '@e,52,e,0'
    setpoints:
      B:HPQ2: 1.348
      B:VPQ2: 16.2
      L:D73BPH: 1.2
      L:D73BPV: -0.53
      L:D74BPH: 0.341
      L:D74BPV: -1.7
      defaults: null
    settings_role: ril_tuning
formulas: {}
generator:
  max_travel_distances: null
  name: expected_improvement
  numerical_optimizer:
    max_iter: 2000
    max_time: 5.0
    n_restarts: 20
    name: LBFGS
  turbo_controller: null
initial_point_actions:
- type: add_curr
- config:
    fraction: 0.1
    method: 0
    n_points: 3
  type: add_rand
name: ''
observable_formulas: {}
relative_to_current: true
vocs:
  constants: {}
  constraints: {}
  objectives:
    VTrajError_SumSqBPM_calc:
      dtype: null
      type: MinimizeObjective
  observables:
    B:VPQ2-SETPOINT:
      dtype: null
      type: Observable
    L:D73BPV-SETPOINT:
      dtype: null
      type: Observable
    L:D74BPV-SETPOINT:
      dtype: null
      type: Observable
  variables:
    L:D72TMV:
      default_value: null
      domain:
      - 0.31798095703125
      - 0.91798095703125
      dtype: null
      type: ContinuousVariable
    L:D73TMV:
      default_value: null
      domain:
      - -2.067333984375
      - -1.467333984375
      dtype: null
      type: ContinuousVariable
    L:D74TMV:
      default_value: null
      domain:
      - 0.279345703125
      - 0.879345703125
      dtype: null
      type: ContinuousVariable
vrange_hard_limit:
  L:D72TMV:
  - -4.5
  - 4.0
  L:D73TMV:
  - -4.5
  - 4.0
  L:D74TMV:
  - -4.5
  - 4.0
vrange_limit_options:
  L:D72TMV:
    delta: 0.3
    limit_option_idx: 2
  L:D73TMV:
    delta: 0.3
    limit_option_idx: 2
  L:D74TMV:
    delta: 0.3
    limit_option_idx: 2
xopt_version: 3.2.2

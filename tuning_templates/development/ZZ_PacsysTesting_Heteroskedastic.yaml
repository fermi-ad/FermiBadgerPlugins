badger_version: 1.6.0
critical_constraint_names: []
description: "Heteroskedastic noise testbed on ACNET test/scratch devices: minimize
  Heteroskd_f, whose synthetic noise has a known, position-dependent sigma. Its
  variance estimate (Heteroskd_f_var) makes Xopt fit a heteroskedastic GP; score the
  recovery afterwards with scripts/heteroskd_recovery.py <run file>."
environment:
  name: ZZ_PacsysTesting_Heteroskedastic
  params:
    debug: false
    settings_role: testing
    heteroskd_devices:
    - Z:CUBE_X
    - Z:CUBE_Y
    noise_shape: distance
    noise_sigma0: 0.5
    noise_scale: 0.5
    noise_center: 0.0
    noise_width: 2.0
    n_samples: 10
    seed: -1
generator:
  max_travel_distances: null
  n_interpolate_points: null
  name: expected_improvement
  numerical_optimizer:
    max_iter: 2000
    max_time: null
    n_restarts: 20
    name: LBFGS
  turbo_controller: null
initial_point_actions:
- config:
    fraction: 1.0
    method: 0
    n_points: 8
  type: add_rand
name: zz-pacsys-testing-heteroskedastic
relative_to_current: false
vocs:
  constants: {}
  constraints: {}
  objectives:
    Heteroskd_f: MINIMIZE
  observables:
  - Heteroskd_f_var
  - Heteroskd_f_true_var
  variables:
    Z:CUBE_X:
    - -5.0
    - 5.0
    Z:CUBE_Y:
    - -5.0
    - 5.0
vrange_limit_options:
  Z:CUBE_X:
    delta: 10.0
    limit_option_idx: 2
    ratio_curr: 0.1
    ratio_full: 0.1
  Z:CUBE_Y:
    delta: 10.0
    limit_option_idx: 2
    ratio_curr: 0.1
    ratio_full: 0.1

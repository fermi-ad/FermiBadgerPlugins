description: 'Operations template, promoted 2026-11-17. Generated by tuning-reflection
  from the elog and data logger (255 catalog entries, 176 with L:D7TOR logger data).


  Console: the RIL tuning knobs are on parameter page L48, sub-page <1>, tab PWR_SUP.


  Goal: minimize L:TK4RAD rather than maximize L:D7TOR -- the elog''s own goal-tags
  on these sessions name losses 151 times vs. throughput 58 and efficiency 81 (of
  255 sessions; 86 name exactly one goal, 65 of those losses vs. 9 throughput).

  L:TK4RAD started over its old constraint (50.0) in 40/221 sessions; of those, only
  5 ended at or under it by the session''s end, and 17 ended worse -- the prior template''s
  L:D7TOR-centric objective was not actually tracking this.

  Objective: L:TK4RAD MINIMIZE.

  New constraint: L:D7TOR > 20 (a throughput floor: the historical 10th percentile
  of L:D7TOR across 176 RIL-tuning sessions -- without it, minimizing a loss monitor
  alone has a degenerate optimum at zero beam).

  Variables, hard limits, and all other constraints are carried over unchanged from
  01_Linac_RIL_tuning.yaml, not recomputed (settings were then thought unlogged,
  from an event-qualified probe; a bare logger read does return them, 2026-11-19).

  Operational context (not tuned here): parameter page L48, sub-page <1>, tabs SRC_A and
  SRC_B, the ion sources A and B, which set the beam the RIL receives. Per source (A named;
  B the same with B): extractor supply L:AEXTI, L:AEXTV, L:AEXTSV, L:AEXTSW, L:AEXTON,
  L:AEXTPW; source current toroid L:ATOR; arc supply L:AARCSI, L:AARCV, L:AARCI, L:AARCZ,
  L:AARCON, L:AARCPW; gas valve L:AGASV, L:AGASSP, L:AGASON, L:AGASOW, pressure
  L:AIGAUT, L:AIG, L:ALCC (pressure loop G:PIDPV[3] on L:AIGAUT; B: G:PIDPV[2] on
  L:BIGAUT; A also L:AWRVG, B also L:BGASI); temperatures L:ACTEMP, L:ASTEMP, L:ATTEMP,
  L:AVTEMP, L:ABTEMP, L:ARACKT; heaters L:ASRCI, L:ATUBEI, L:AVLVI, L:ABOILI, boiler loop
  L:ABSP (G:PIDPV[8] on L:ABTEMP; B: G:PIDPV[9]); spark counters L:AEVS, L:AEIS. Read
  from two screenshots by exact glyph matching, checked by eye.

  Context (same study): the levels of L:TUNRAD and L:TK1RAD follow the settings of the
  source in use and the beam rate (held-out R2 0.84 and 0.75), but how they respond to the
  knobs does not (no interaction found); L:TK4RAD is predicted by none of it (its level changes
  little from week to week).
  Context variables (ticked; read every step and modeled, never moved): L:AARCI.READING,
  L:ASRCI.READING, L:AEXTV.READING, source A arc current, heater current, and extractor
  volts, the top three source parameters for L:D7TOR (docs/ril-source-context.md). On
  source B, tick the L:B ones instead.

  '

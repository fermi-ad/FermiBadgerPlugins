description: |
  Goal: Raise Linac transmission by tuning the ion source, LEBT, MEBT and RF phases.
  Objective: L:D7TOR MAXIMIZE (toroid at the Linac end); G:LINEFF is kept as an observable.
  Variables: source trims L:ATRMHU, L:ATRMVU, L:ATRMHD, L:ATRMVD; solenoids L:ASOL, L:LSOL;
    LEBT trims L:LTRMH, L:LTRMV; MEBT quads as mults mult:MUQ (L:MUQ1, L:MUQ2) and mult:MDQ
    (L:MDQ1, L:MDQ2): the variable is the knob's integer step count, each quad moves by
    coefficient x mult_step_size x steps from its as-found setting (the four quads stay
    available to tick individually instead, but not together with their mult);
    MEBT trims L:MDQ1H, L:MDQ1V, L:MDQ2H, L:MDQ2V; RF phases L:RFQPAH, L:RFBPAH.
  Constraints: L:D7LMSM < 18, L:TK4RAD < 50, L:TUNRAD < 150.
    SumAbs_SourceATrims < 7 (sum |I| of the source A trims, one bulk supply; 7 A is a stand-in
    pending expert confirmation). The environment also clips the largest trim to keep each
    supply group's sum under its limit before any setting.
    MultOOB_MUQ, MultOOB_MDQ < 0.5: fraction of the last mult step lost to a quad's own bounds
    (0 good; nonzero means the optimum wants to go past a quad's bounds, the quad was clipped).
  Observables: G:LINEFF, L:D7LMSM, L:TK4RAD, B:BLMLAM, B:BLMQ3, B:BOOEFF.
  Windows: +-0.5 source and MEBT trims, +-0.1 LEBT trims, +-5 solenoids, +-2 steps mults, +-10 deg RF phases,
    all around the live readback at load (Automatic).
  Notes: readings on $52, B:BOOEFF on $1F. L:RFQPAH, L:RFBPAH and L:V5QSET are periodic (360 deg).
    Expected improvement with the safety turbo controller.
    Mult coefficients are 20.0 and the step size 0.05 (one step = 1.0 A on each quad of the pair).
  Other subsets: uncheck variables in the GUI for a narrower tune (source trims only; trims and
    solenoids; add LEBT/MEBT; RF phases only). L:V5QSET (Tank 5 phase, +-0.5) is unchecked but
    ready to tick. Pick the mobo generator and a second objective (e.g. L:TUNRAD MINIMIZE or
    L:D34LM MINIMIZE) for a Pareto front.
environment:
  name: 01_Linac_RIL_tuning_Acsys
  params:
    debug: false
    mult_step_size:
      MDQ: 0.05
      MUQ: 0.05
    mults:
      MDQ: L:MDQ1*20.0,L:MDQ2*20.0
      MUQ: L:MUQ1*20.0,L:MUQ2*20.0
    periods:
      L:RFBPAH: 360.0
      L:RFQPAH: 360.0
      L:V5QSET: 360.0
    sample_events:
      B:BOOEFF: '@e,1f,e,0'
      default: '@e,52,e,0'
    settings_role: ril_tuning
    supply_groups:
      MEBTQ1trims: L:MUQ1H,L:MUQ1V,L:MDQ1H,L:MDQ1V
      MEBTQ2trims: L:MUQ2H,L:MUQ2V,L:MDQ2H,L:MDQ2V
      SourceATrims: L:ATRMHU,L:ATRMVU,L:ATRMHD,L:ATRMVD
      SourceBTrims: L:BTRMHU,L:BTRMVU,L:BTRMHD,L:BTRMVD
    supply_limits:
      MEBTQ1trims: 7.0
      MEBTQ2trims: 7.0
      SourceATrims: 7.0
      SourceBTrims: 7.0

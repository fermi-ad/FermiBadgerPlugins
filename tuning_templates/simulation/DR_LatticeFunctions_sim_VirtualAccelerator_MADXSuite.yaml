badger_version: 1.6.0
generator:
  max_travel_distances: null
  name: expected_improvement
  numerical_optimizer:
    discrete_max_batch_size: 2048
    discrete_max_choices: 4096
    max_iter: 1000
    max_time: 0.5
    mixed_max_discrete_configurations: 512
    n_restarts: 5
    name: LBFGS
  turbo_controller: null
initial_point_actions:
- type: add_curr
- config:
    fraction: 0.1
    method: 0
    n_points: 3
  type: add_rand
xopt_version: 3.2.1
name: DR_LatticeFunctions_sim
description: |
  Goal: restore the lattice functions after quad errors: even beta functions, no dispersion in the
    straights, the harmonic-sextupole phase advance, and small beams at the kickers.
  Objective: the sum of the RMS beta beat in x and y at the BPMs and the RMS dispersion (m) at the
    straight-section BPMs (^p_d[hv]p[1-6]0[1-7]$: the 41 dispersion-free BPMs), MINIMIZE. Equal weights:
    untested.
  Constraints: phase_x(m0_dsx602,m0_dsx502) within 3 deg of 1050 (35 x 30 deg; design 1051.8, 1048.1 with
    these errors);
    beta at the kickers d_dkk* (max betx < 11 m, max bety < 13.5 m; design 10.2, 12.7);
    tunes within 0.01 of design.
  Variables: the 8 quad supplies most effective against these errors, by sensitivity (|J^T r|):
    main buses i_dqf, i_dqd +-0.2%, i_dqss +-0.5% (1% moves qx by 0.1); i_dq404 +-3%;
    i_dqs105, i_dqs605, i_dqs301, i_dqs505 +-10% (their hard limits). Windows from the least-
    squares solution (bus changes under 0.4%, i_dq404 1.6%, two i_dqs at their limits).
  Machine errors: six quad fudge factors off by 2-2.5%: beta beat 7.1% (x), 3.4% (y); straight
    dispersion 0.08 m RMS (design 0.017 m). Least squares on these knobs halves the beat but leaves
    the straight dispersion: three erring quads (DQ309, DQ416, DQ512) have only main-bus power, and
    the shunts of two others (I_DQS213, I_DQS607) are not among the knobs. The solution space is
    degenerate; the knob choice suits this error set only.
relative_to_current: false
critical_constraint_names: []
formulas: {}
constraint_formulas: {}
observable_formulas: {}
vrange_hard_limit: {}
vrange_limit_options: {}
additional_variables: []

badger_version: 1.6.0
generator:
  max_travel_distances: null
  name: expected_improvement
  numerical_optimizer:
    discrete_max_batch_size: 2048
    discrete_max_choices: 4096
    max_iter: 1000
    max_time: 0.5
    mixed_max_discrete_configurations: 512
    n_restarts: 5
    name: LBFGS
  turbo_controller: null
initial_point_actions:
- type: add_curr
- config:
    fraction: 0.1
    method: 0
    n_points: 3
  type: add_rand
xopt_version: 3.2.1
name: DR_OrbitH_sim
description: |
  Goal: flatten the horizontal closed orbit (base orbit) with the horizontal trim dipoles.
  Objective: rms(x@^p_dhp) MINIMIZE, the RMS orbit at the horizontal BPMs (m).
  Variables: the 11 horizontal trims i_dht*, -3 to 3 A.
  Machine errors: eight quads offset 0.2-0.3 mm (shift_x, shift_y), giving 0.62 mm (x) and 1.27 mm (y)
    RMS orbit. The trims cannot cancel quad offsets exactly: least squares reaches 0.21 mm (x),
    0.25 mm (y), with trims within 2.6 A.
  Notes: the movable quad stands (LH_DQ*, LV_DQ*) are defined in this lattice but drive nothing,
    so they are not offered. The other plane is recorded as an observable.
relative_to_current: false
critical_constraint_names: []
formulas: {}
constraint_formulas: {}
observable_formulas: {}
vrange_hard_limit: {}
vrange_limit_options: {}
additional_variables: []

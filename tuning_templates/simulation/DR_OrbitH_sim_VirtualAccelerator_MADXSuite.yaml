  params:
    beam_p0c_eV: 8889999999.0
    debug: false
    lattice_filename: sim_configs/DeliveryRing/mu2e-dr-model-v2026.03.23.madx
    rel_range: 0.1
    sequence_name: full
    zero_half_range: 3.0
    machine_errors:
      q_dq303.shift_x: 0.0002
      q_dq215.shift_x: -0.0003
      q_dq418.shift_x: 0.00025
      q_dq511.shift_x: -0.0002
      q_dq306.shift_y: 0.0002
      q_dq212.shift_y: -0.00025
      q_dq410.shift_y: 0.0003
      q_dq608.shift_y: -0.0002
    extra_observables:
    - rms(x@^p_dhp)
    - rms(y@^p_dvp)

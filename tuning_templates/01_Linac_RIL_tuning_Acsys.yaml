description: |
  Goal: Raise Linac transmission by tuning the ion source, LEBT, MEBT and RF phases.
  Objective: G:LINEFF MAXIMIZE.
  Variables: source trims L:ATRMHU, L:ATRMVU, L:ATRMHD, L:ATRMVD; solenoids L:ASOL, L:LSOL;
    LEBT trims L:LTRMH, L:LTRMV; MEBT quads L:MUQ1, L:MUQ2, L:MDQ1, L:MDQ2 (independently);
    RF phases L:RFQPAH, L:RFBPAH.
  Constraints: L:D7TOR > 25, L:TK1RAD < 18, L:TUNRAD < 80, L:D34LM < 1.1.
  Observables: L:D7LMSM, L:TK4RAD, B:BLMLAM, B:BLMQ3, B:BOOEFF.
  Windows: +-0.5 source trims, +-0.1 LEBT trims, +-5 solenoids, +-2 MEBT quads, +-10 deg RF phases,
    all around the live readback at load (Automatic).
  Notes: readings on $52, B:BOOEFF on $1F. L:RFQPAH, L:RFBPAH and L:V5QSET are periodic (360 deg).
    Expected improvement with the safety turbo controller.
  Other subsets: uncheck variables in the GUI for a narrower tune (source trims only; trims and
    solenoids; add LEBT/MEBT; RF phases only). L:V5QSET (Tank 5 phase, +-0.5) is unchecked but
    ready to tick. Pick the mobo generator and a second objective (e.g. L:TUNRAD MINIMIZE or
    L:D34LM MINIMIZE) for a Pareto front.
environment:
  name: 01_Linac_RIL_tuning_Acsys
  params:
    debug: false
    periods:
      L:RFBPAH: 360.0
      L:RFQPAH: 360.0
      L:V5QSET: 360.0
    sample_events:
      B:BOOEFF: '@e,1f,e,0'
      default: '@e,52,e,0'
    settings_role: ril_tuning
formulas: {}
generator:

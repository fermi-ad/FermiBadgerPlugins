[workspace]
name = "FermiBadgerPlugins"
channels = ["conda-forge"]
# macOS wheels for cpymad/xtrack etc. are tagged macosx_15_0; without this,
# pixi assumes an older minimum macOS and falls back to a from-source build
# that fails (no bundled MAD-X headers).
platforms = [{ name = "osx-arm64-macos15", platform = "osx-arm64", macos = "15.0" }, "linux-64"]

[tasks]
# Patches + config.local.yaml + discoverability check, for whichever
# environment this is run in (`pixi run setup` for default/onsite,
# `pixi run -e offsite setup` off the FNAL network).
setup = "bash pixi_setup.sh"
# The operator launch line: `pixi run safe-badger mini -t <template>` runs
# -mini under a launcher that restores every device the session changed if
# Badger exits without a Keep/Revert answer. Also `safe-badger diff <file>`
# and `safe-badger restore <file>`. See safe_badger.py.
safe-badger = "python safe_badger.py"

[activation.env]
# linear_operator 0.6.1 (under gpytorch/botorch, so every Bayesian generator)
# decorates two functions with @torch.jit.script, which PyTorch 2.14 deprecates:
# one FutureWarning per process, in the GUI and in each run worker. Only that
# warning, attributed to torch.jit._script, is silenced; drop this once a
# linear_operator release stops using torch.jit.script.
PYTHONWARNINGS = "ignore::FutureWarning:torch.jit._script"

[dependencies]
python = "3.12.1.*"
badger-opt = "1.6.0.*"
ipywidgets = "*"  # xopt's pip metadata requires it; the conda recipe does not pull it in
# Pinned to match the conda env's resolution: our Badger patches (notably
# pydantic_editor-badger-1.6.0-dict-subtypes.patch) are version-sensitive to
# pydantic's type-introspection internals, and pixi's unpinned resolve picked
# a newer point release (2.14.1) than conda's cached one (2.13.5) that
# reintroduced the "Dict type must have subtypes" error the patch fixes.
pydantic = "2.13.5.*"

[pypi-dependencies]
cpymad = "==1.19.0"
xcoll = "==0.11.1"
xdeps = "==0.10.19"
xfields = "==0.25.18"
xobjects = "==0.6.4"
xpart = "==0.23.13"
xsuite = "==0.54.0"
xtrack = "==0.107.0"
pacsys = "==0.3.0"

# acsys is FNAL-network-only. The default environment includes it (operators
# on the MCR host always have FNAL network, and dropping the -e flag there
# is worth it); off-network dev work opts out with `pixi install -e offsite`.
[feature.onsite.pypi-dependencies]
acsys = "==0.12.8"

[feature.onsite.pypi-options]
extra-index-urls = ["https://www-bd.fnal.gov/pip3"]

[environments]
default = { features = ["onsite"] }
offsite = []

AUTO_REFRESH:
  description: Permits each run to start from the initial points calculated based
    on the current values and the rules
  display_name: Auto-refresh
  is_path: false
  value: false
BADGER_ARCHIVE_ROOT:
  description: This setting (BADGER_ARCHIVE_ROOT) tells Badger where to archive the
    historical optimization runs
  display_name: archive root
  is_path: true
  value: /Users/stjohn/Development/BadgerArchive
BADGER_DATA_DUMP_PERIOD:
  description: Minimum time interval between data dumps, unit is second
  display_name: data dump period
  is_path: false
  value: 1
BADGER_ENABLE_ADVANCED:
  description: Enable advanced features on the GUI
  display_name: enable advanced features
  is_path: false
  value: true
BADGER_LOGBOOK_ROOT:
  description: This setting (BADGER_LOGBOOK_ROOT) tells Badger where to send the logs
    (GUI mode)
  display_name: logbook root
  is_path: true
  value: /Users/stjohn/Development/BadgerLogs
BADGER_LOG_DIRECTORY:
  description: Directory where daily log files will be stored
  display_name: log directory
  is_path: true
  value: /Users/stjohn/Development/BayesOptimization_Xopt/FermiBadgerPlugins/logs
BADGER_LOG_LEVEL:
  description: Logging level for the Badger logger
  display_name: logging level
  is_path: false
  value: WARNING
BADGER_PLUGIN_ROOT:
  description: This setting (BADGER_PLUGIN_ROOT) tells Badger where to look for the
    plugins
  display_name: plugin root
  is_path: true
  value: /Users/stjohn/Development/BayesOptimization_Xopt/FermiBadgerPlugins/plugins
BADGER_PYTORCH_TENSOR_SHARING_STRATEGY:
  description: Setting for which strategy pytorch will use when passing tensors to
    subprocesses. Valid options are 'file_system' (default) or 'file_descriptor'
  display_name: torch tensor sharing strategy
  is_path: false
  value: file_system
BADGER_TEMPLATE_ROOT:
  description: This setting (BADGER_TEMPLATE_ROOT) tells Badger where to store the
    routine templates
  display_name: template root
  is_path: true
  value: /Users/stjohn/Development/BayesOptimization_Xopt/FermiBadgerPlugins/tuning_templates
BADGER_THEME:
  description: Theme for the Badger GUI
  display_name: theme
  is_path: false
  value: dark
